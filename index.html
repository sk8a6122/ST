<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#E6E9E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sober">
<title>Sober Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6B47'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --ground:#E6E9E2; --panel:#F1F3EE; --ink:#16241E; --muted:#6E786F; --line:#CBD2C6;
  --green:#2E6B47; --green-soft:#D3E3D6; --brick:#8C3B2E; --brick-soft:#EBD3CD;
  --display:"Fraunces",Georgia,serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--ground)}
.page{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  min-height:100dvh;width:100%;max-width:520px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(56px + env(safe-area-inset-bottom));overflow-x:hidden}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.count-wrap{display:flex;align-items:baseline;gap:9px}
.count{font-family:var(--display);font-weight:700;font-size:clamp(48px,17vw,68px);line-height:.88;letter-spacing:-.03em;color:var(--green)}
.count-label{font-family:var(--display);font-size:18px;font-weight:400}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:18px}
.stat{background:var(--panel);padding:10px 8px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em}
.stat span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}

.ledger{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:13px}
.ledger h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 11px;font-weight:500}
.led-rows{display:flex;justify-content:space-between;gap:6px}
.led{flex:1 1 0}
.led .amt{font-family:var(--mono);font-size:clamp(16px,5.2vw,21px);font-weight:600;letter-spacing:-.03em;display:block;white-space:nowrap}
.led .amt.g{color:var(--green)} .led .amt.r{color:var(--brick)}
.led .cap{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.led.net{text-align:right}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%;transition:width .35s ease}
.b-g{background:var(--green)} .b-r{background:var(--brick)}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 10px}
.monthbar h2{font-family:var(--display);font-weight:600;font-size:clamp(18px,5.6vw,23px);margin:0;letter-spacing:-.01em;color:var(--ink)}
.nav{display:flex;gap:5px;flex:0 0 auto}
.nav button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--ink);font-size:15px;cursor:pointer;line-height:1;padding:0}
.nav button:active{background:var(--line)}

.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:5px;width:100%}
.dow span{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.cell{aspect-ratio:1;width:100%;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;position:relative;overflow:hidden;transition:transform .12s ease}
.cell:active{transform:scale(.92)}
.cell.blank{visibility:hidden}
.cell.sober{background:var(--green);border-color:var(--green);color:#F1F3EE}
.cell.not{background:var(--brick);border-color:var(--brick);color:#F7EFED}
.cell.money{border-color:#B9C4B7}
.cell.future{opacity:.32;cursor:default}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.75}

.legend{display:flex;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.quick{display:flex;gap:8px;margin-top:18px}
.quick button{flex:1 1 0;padding:13px 6px;border-radius:9px;border:1px solid var(--line);font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer}
.quick .yes{background:var(--green-soft);border-color:#B6CFBC;color:var(--green)}
.quick .no{background:var(--brick-soft);border-color:#DCBDB6;color:var(--brick)}

.block{margin-top:24px;border-top:1px solid var(--line);padding-top:15px}
.block h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.block label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--muted);margin:7px 0 0;line-height:1.5}
.reset{margin-top:12px;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;font-family:var(--sans)}

.status{margin-top:12px;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.5;display:none}
.status.on{display:block}
.status.bad{background:var(--brick-soft);color:var(--brick)}
.status.good{background:var(--green-soft);color:var(--green)}

details summary{font-size:12.5px;color:var(--muted);cursor:pointer;padding:4px 0}
textarea{width:100%;min-height:70px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--ink);font-family:var(--mono);font-size:12px;resize:vertical;line-height:1.4}
input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:16px}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1 1 0;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(22,36,30,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ground);border-radius:16px 16px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;margin:0 auto;
  max-height:86dvh;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 -8px 40px rgba(22,36,30,.22)}
.sheet.on{transform:translateY(0)}
.sheet h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 2px;letter-spacing:0;text-transform:none;color:var(--ink)}
.sheet .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:15px}
.choice{display:flex;gap:8px;margin-bottom:15px}
.choice button{flex:1 1 0;padding:14px 6px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.choice button.sel-y{background:var(--green);border-color:var(--green);color:#F1F3EE}
.choice button.sel-n{background:var(--brick);border-color:var(--brick);color:#F7EFED}
.money-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:15px}
.money-in label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.acts{display:flex;gap:8px}
.acts button{flex:1 1 0;padding:14px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.save{background:var(--ink);color:var(--ground);border:1px solid var(--ink)}
.clear{background:none;border:1px solid var(--line);color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);background:var(--ink);color:var(--ground);
  padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:9;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <p class="eyebrow">Current streak</p>
  <div class="count-wrap"><span class="count" id="streak">0</span><span class="count-label" id="streakUnit">days</span></div>
  <p class="sub" id="subline">Tap a day to mark it.</p>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Sober days</span></div>
    <div class="stat"><b id="sBest">0</b><span>Best streak</span></div>
    <div class="stat"><b id="sSlips">0</b><span>Not sober</span></div>
  </div>

  <section class="ledger">
    <h2>Ledger</h2>
    <div class="led-rows">
      <div class="led"><span class="amt g" id="mSaved">$0</span><div class="cap">Saved</div></div>
      <div class="led"><span class="amt r" id="mSpent">$0</span><div class="cap">Spent</div></div>
      <div class="led net"><span class="amt" id="mNet">$0</span><div class="cap">Net</div></div>
    </div>
    <div class="bar"><i class="b-g" id="barG" style="width:0%"></i><i class="b-r" id="barR" style="width:0%"></i></div>
  </section>

  <div class="monthbar">
    <h2 id="monthName">Month</h2>
    <div class="nav">
      <button id="prev" aria-label="Previous month">&larr;</button>
      <button id="today" aria-label="This month">&#9679;</button>
      <button id="next" aria-label="Next month">&rarr;</button>
    </div>
  </div>

  <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><i style="background:var(--green)"></i>Sober</span>
    <span><i style="background:var(--brick)"></i>Not sober</span>
    <span><i style="background:var(--panel);border:1px solid var(--line)"></i>Unmarked</span>
    <span>&#9679; money logged</span>
  </div>

  <div class="quick">
    <button class="yes" id="qYes">Today was sober</button>
    <button class="no" id="qNo">Today wasn't</button>
  </div>

  <div class="block">
    <h3>Settings</h3>
    <label for="dflt">Default amount saved per sober day</label>
    <input type="number" id="dflt" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
    <p class="hint">Fills in automatically each time you mark a day sober.</p>
    <div class="status" id="status"></div>
  </div>

  <div class="block">
    <h3>Backup</h3>
    <div class="row2">
      <button id="btnFile">Download backup</button>
      <button id="btnLoad">Load backup file</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    <details>
      <summary>Or use a backup code</summary>
      <textarea id="backup" spellcheck="false" aria-label="Backup code"></textarea>
      <div class="row2">
        <button id="btnCopy">Copy code</button>
        <button id="btnRestore">Restore from code</button>
      </div>
    </details>
    <button class="reset" id="reset">Erase all data</button>
  </div>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <h3 id="shTitle">Day</h3>
  <div class="when" id="shWhen"></div>
  <div class="choice"><button id="chYes">Sober</button><button id="chNo">Not sober</button></div>
  <div class="money-in">
    <div><label for="inSaved">Amount saved</label><input type="number" id="inSaved" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div><label for="inSpent">Amount spent</label><input type="number" id="inSpent" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
  </div>
  <div class="acts"><button class="clear" id="btnClear">Clear day</button><button class="save" id="btnSave">Save</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='sober-calendar-v1';
let state={days:{},dflt:0};
let view=new Date(), editing=null, editStatus=null, warned=false;

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0;};
const money=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2});
const TODAY=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());})();
const TK=keyOf(TODAY);
const $=id=>document.getElementById(id);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400);}
function setStatus(kind,msg){const s=$('status');if(!kind){s.className='status';s.textContent='';return;}s.className='status on '+kind;s.textContent=msg;}

/* ---------- storage: device storage first, host storage as fallback ---------- */
function readLocal(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
function writeLocal(v){try{localStorage.setItem(KEY,v);return true;}catch(e){return false;}}

async function persist(){
  const payload=JSON.stringify(state);
  $('backup').value=payload;
  let ok=writeLocal(payload);
  if(!ok){
    try{
      if(!window.storage||typeof window.storage.set!=='function')throw 0;
      await window.storage.set(KEY,payload);ok=true;
    }catch(e){}
  }
  if(!ok&&!warned){
    warned=true;
    setStatus('bad','This browser won\u2019t let the page save. Use Download backup below to keep your data.');
  }else if(ok&&warned){warned=false;setStatus(null);}
  return ok;
}

async function load(){
  let raw=readLocal();
  if(!raw){
    try{const r=await window.storage.get(KEY);if(r&&r.value)raw=r.value;}catch(e){}
  }
  if(raw){
    try{const p=JSON.parse(raw);state.days=p.days||{};state.dflt=num(p.dflt);}catch(e){}
  }
  $('dflt').value=state.dflt?state.dflt:'';
  render();
  if(!writeLocal(JSON.stringify(state))){
    if(!(window.storage&&typeof window.storage.set==='function')){
      warned=true;
      setStatus('bad','This browser won\u2019t let the page save. Use Download backup below to keep your data.');
    }
  }
}

/* ---------- stats ---------- */
function stats(){
  const d=state.days;let sober=0,slips=0,saved=0,spent=0;
  for(const k in d){
    if(d[k].status==='sober')sober++;else if(d[k].status==='not')slips++;
    saved+=num(d[k].saved);spent+=num(d[k].spent);
  }
  let cur=0,cursor=new Date(TODAY);
  if(!d[TK])cursor.setDate(cursor.getDate()-1);
  while(d[keyOf(cursor)]&&d[keyOf(cursor)].status==='sober'){cur++;cursor.setDate(cursor.getDate()-1);}
  const sk=Object.keys(d).filter(k=>d[k].status==='sober').sort();
  let best=0,run=0,prev=null;
  for(const k of sk){const cd=parse(k);run=(prev&&Math.round((cd-prev)/86400000)===1)?run+1:1;if(run>best)best=run;prev=cd;}
  return{sober,slips,saved,spent,cur,best:Math.max(best,cur)};
}

function render(){
  const s=stats();
  $('streak').textContent=s.cur;
  $('streakUnit').textContent=s.cur===1?'day':'days';
  $('sTotal').textContent=s.sober;$('sBest').textContent=s.best;$('sSlips').textContent=s.slips;
  const te=state.days[TK];
  $('subline').textContent=!te||!te.status?'Today isn\u2019t marked yet.'
    :te.status==='sober'?'Today is marked sober.':'Today is marked not sober.';
  $('mSaved').textContent=money(s.saved);$('mSpent').textContent=money(s.spent);
  const net=s.saved-s.spent;
  $('mNet').textContent=money(net);
  $('mNet').style.color=net>0?'var(--green)':net<0?'var(--brick)':'var(--ink)';
  const tot=s.saved+s.spent;
  $('barG').style.width=tot?(s.saved/tot*100)+'%':'0%';
  $('barR').style.width=tot?(s.spent/tot*100)+'%':'0%';

  const y=view.getFullYear(),m=view.getMonth();
  $('monthName').textContent=view.toLocaleString(undefined,{month:'long'})+' '+y;
  const lead=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<lead;i++){const b=document.createElement('div');b.className='cell blank';g.appendChild(b);}
  for(let day=1;day<=dim;day++){
    const dt=new Date(y,m,day),k=keyOf(dt),e=state.days[k];
    const btn=document.createElement('button');
    btn.className='cell';btn.textContent=day;
    if(e&&e.status==='sober')btn.classList.add('sober');
    if(e&&e.status==='not')btn.classList.add('not');
    if(e&&(num(e.saved)||num(e.spent))){
      btn.classList.add('money');
      const dot=document.createElement('span');dot.className='dot';btn.appendChild(dot);
    }
    if(k===TK)btn.classList.add('today');
    if(dt>TODAY){btn.classList.add('future');btn.disabled=true;}
    else btn.addEventListener('click',()=>openSheet(k));
    g.appendChild(btn);
  }
  $('backup').value=JSON.stringify(state);
}

/* ---------- day sheet ---------- */
function paintChoice(){
  $('chYes').className=editStatus==='sober'?'sel-y':'';
  $('chNo').className=editStatus==='not'?'sel-n':'';
}
function openSheet(k){
  editing=k;const e=state.days[k]||{};editStatus=e.status||null;
  const d=parse(k);
  $('shTitle').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('shWhen').textContent=k===TK?'Today':d.getFullYear();
  $('inSaved').value=num(e.saved)||'';$('inSpent').value=num(e.spent)||'';
  paintChoice();$('sheet').classList.add('on');$('scrim').classList.add('on');
}
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');editing=null;}

$('chYes').onclick=()=>{editStatus='sober';paintChoice();const f=$('inSaved');if(!f.value&&state.dflt)f.value=state.dflt;};
$('chNo').onclick=()=>{editStatus='not';paintChoice();};

$('btnSave').onclick=async()=>{
  if(!editing)return;
  const saved=num($('inSaved').value),spent=num($('inSpent').value);
  if(!editStatus&&!saved&&!spent){toast('Nothing to save yet');return;}
  state.days[editing]={status:editStatus,saved:saved,spent:spent};
  const bits=[];
  if(editStatus==='sober')bits.push('Sober');else if(editStatus==='not')bits.push('Not sober');
  if(saved)bits.push(money(saved)+' saved');
  if(spent)bits.push(money(spent)+' spent');
  closeSheet();render();
  const ok=await persist();
  toast((ok?'Saved \u2014 ':'On screen only \u2014 ')+bits.join(' \u00b7 '));
};
$('btnClear').onclick=async()=>{if(editing)delete state.days[editing];closeSheet();render();await persist();toast('Day cleared');};
$('scrim').onclick=closeSheet;

async function markToday(status){
  const prev=state.days[TK]||{};
  const saved=status==='sober'?(num(prev.saved)||state.dflt):num(prev.saved);
  state.days[TK]={status:status,saved:saved,spent:num(prev.spent)};
  view=new Date();render();
  const ok=await persist();
  toast(status==='sober'
    ?(ok?'Today marked sober':'Marked (on screen only)')+(saved?' \u00b7 '+money(saved):'')
    :'Today marked \u2014 tap it to log an amount');
}
$('qYes').onclick=()=>markToday('sober');
$('qNo').onclick=()=>markToday('not');

$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
$('today').onclick=()=>{view=new Date();render();};

const dfltEl=$('dflt');
const saveDflt=async()=>{state.dflt=num(dfltEl.value);await persist();};
dfltEl.addEventListener('input',saveDflt);
dfltEl.addEventListener('blur',saveDflt);

/* ---------- backup ---------- */
function applyBackup(p){
  if(!p||typeof p!=='object'||typeof p.days!=='object')return false;
  state.days=p.days||{};state.dflt=num(p.dflt);
  dfltEl.value=state.dflt?state.dflt:'';
  render();persist();return true;
}
$('btnFile').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sober-backup-'+TK+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast('Backup downloaded');
};
$('btnLoad').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{applyBackup(JSON.parse(r.result))?toast('Backup loaded'):toast('That file isn\u2019t readable');}
    catch(err){toast('That file isn\u2019t readable');}
  };
  r.readAsText(f);e.target.value='';
};
$('btnCopy').onclick=async()=>{
  const ta=$('backup');
  try{await navigator.clipboard.writeText(ta.value);toast('Backup code copied');}
  catch(e){ta.focus();ta.select();toast('Select all and copy');}
};
$('btnRestore').onclick=()=>{
  try{applyBackup(JSON.parse($('backup').value))?toast('Restored'):toast('That code isn\u2019t readable');}
  catch(e){toast('That code isn\u2019t readable');}
};
$('reset').onclick=async()=>{
  if(!confirm('Erase every marked day and all amounts? This cannot be undone.'))return;
  state.days={};render();await persist();toast('All data erased');
};

load();
</script>
</body>
</html>
